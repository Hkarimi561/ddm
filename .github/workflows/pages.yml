name: Pages

# Publishes the showcase page and the installers to GitHub Pages:
#   https://<owner>.github.io/<repo>/
#   https://<owner>.github.io/<repo>/install.sh
#   https://<owner>.github.io/<repo>/install.ps1
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/install.*"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp scripts/install.sh scripts/install.ps1 _site/
          # Point the installers and the page at this repository.
          sed -i "s|__DDM_REPO__|${GITHUB_REPOSITORY}|g" _site/install.sh _site/install.ps1 _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
