# Cross-platform release builds. Run locally with:
#   goreleaser release --snapshot --clean --skip=publish
version: 2
project_name: ddm

before:
  hooks:
    - go mod tidy

builds:
  - id: ddm
    main: ./cmd/ddm
    binary: ddm
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: ddm
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # No version in the name, so the installers can always fetch
    # releases/latest/download/ddm_<os>_<arch>.<ext> without calling the API.
    name_template: "ddm_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
